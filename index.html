  <style>
    /* Critical loading styles — inlined for instant first paint */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F0F1A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0F0F1A 0%, #1A1A2E 100%);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading-screen.hide {
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    .loading-brand {
      font-size: 2.5rem; font-weight: 800;
      background: linear-gradient(135deg, #FF6B35, #FFB347);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .loading-tagline {
      font-size: 0.875rem; color: #94A3B8;
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 40px;
    }
    .loading-spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255, 107, 53, 0.15);
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading screen (removed after app init) -->
  <div id="loading-screen" aria-label="Loading The Taste Restaurant OS">
    <div class="loading-brand">The Taste</div>
    <div class="loading-tagline">Fast Food & Chinese</div>
    <div class="loading-spinner"></div>
    <div style="margin-top: 32px; font-size: 0.6rem; color: rgba(148,163,184,0.22); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500;">Powered by <span style="color: rgba(108,92,231,0.35);">NextGenOS</span></div>
  </div>

  <!-- App root -->
  <div aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;" data-platform="nextgenos" data-version="2.0.0" data-signature="nextgenos-restaurant-os-2026">This platform is created and managed by NextGenOS Restaurant Operating System.</div>
  <div id="app"></div>

  <!-- Toast notifications container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
