name: Keep Supabase Database Active

on:
  schedule:
    # Runs daily at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://scxfkjtrrfgpusyigntx.supabase.co/rest/v1/menu_categories?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjeGZranRycmZncHVzeWlnbnR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzAxMjQsImV4cCI6MjA5NDg0NjEyNH0.tvhYcGjxeSjqY6DuMAdMBjHPtP2mKd40u-btKvxongY" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjeGZranRycmZncHVzeWlnbnR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzAxMjQsImV4cCI6MjA5NDg0NjEyNH0.tvhYcGjxeSjqY6DuMAdMBjHPtP2mKd40u-btKvxongY")
          
          echo "Supabase API Ping Response Status Code: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 204 ]; then
            echo "Ping successful! Supabase project remains active."
          elif [ "$STATUS_CODE" -eq 401 ] || [ "$STATUS_CODE" -eq 403 ]; then
            echo "Ping registered with database (received auth status: $STATUS_CODE). Database is active."
          else
            echo "Warning: Unexpected response status code: $STATUS_CODE"
            exit 1
          fi
